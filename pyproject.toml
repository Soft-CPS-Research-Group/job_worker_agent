[project]
name = "job-worker-agent"
version = "0.5.4"
description = "Worker agent for the OPEVA job queue"
authors = [
    {name = "OPEVA Team"}
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "docker>=7.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
union = [
    "flyte==2.5.8",
    "keyrings.alt>=5.0",
    "boto3>=1.35",
    "kubernetes>=31.0",
]
test = [
    "pytest>=7.0",
    "pytest-mock>=3.10"
]

[project.scripts]
job-worker-agent = "worker_agent.cli:main"

[build-system]
requires = ["setuptools>=62", "wheel"]
build-backend = "setuptools.build_meta"
