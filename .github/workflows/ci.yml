name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run tests
        run: pytest

  docker:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
      DEFAULT_IMAGE_NAME: calof/job_worker_agent
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image tags
        run: |
          IMAGE="${IMAGE_NAME:-$DEFAULT_IMAGE_NAME}"
          {
            echo "IMAGE=${IMAGE}"
            echo "TAGS<<EOF"
            echo "${IMAGE}:${{ github.sha }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "${IMAGE}:latest"
            fi
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "${IMAGE}:${{ github.ref_name }}"
            fi
            echo "EOF"
            echo "UNION_TAGS<<EOF"
            echo "${IMAGE}:union-${{ github.sha }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "${IMAGE}:union-latest"
            fi
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "${IMAGE}:union-${{ github.ref_name }}"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
      - name: Build and push Union worker/runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.union
          platforms: linux/amd64
          push: true
          tags: ${{ env.UNION_TAGS }}
